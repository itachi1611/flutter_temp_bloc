plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Load signing config
def signingProperties = new Properties()
def propsFile = rootProject.file("signing.properties")
if (propsFile.exists()) {
    signingProperties.load(new FileInputStream(propsFile))
} else {
    println("WARNING: signning.properties not found at ${keystorePropertiesFile.path}")
}

android {
    compileSdkVersion flutter.compileSdkVersion
    // ndkVersion "26.1.10909125"
     ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = false
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.fox.flutter.tmp"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        // minSdkVersion flutter.minSdkVersion
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // Define flavors list and signing config for each
    signingConfigs {
        dev {
            // No signing config
        }

        uat {
            // No signing config
        }

        prod {
            storeFile file(signingProperties["PROD_STORE_FILE"])
            storePassword signingProperties["PROD_STORE_PASSWORD"]
            keyAlias signingProperties["PROD_KEY_ALIAS"]
            keyPassword signingProperties["PROD_KEY_PASSWORD"]
        }
    }

    // Define FLAVOR
    flavorDimensions 'app'
    productFlavors {
        dev {
            dimension 'app'
            applicationId 'com.fox.flutter.tmp'
            resValue 'string', 'app_name', '[DEV]foxy'
            // Add id suffix
            // applicationIdSuffix '.dev'
        }

        uat {
            dimension 'app'
            applicationId 'com.fox.flutter.tmp'
            resValue 'string', 'app_name', '[UAT]foxy'
            // Add id suffix
            // applicationIdSuffix '.stg'
        }

        prod {
            dimension 'app'
            applicationId 'com.fox.flutter.tmp'
            resValue 'string', 'app_name', 'foxy'
        }
    }

    buildTypes {
        debug {
            // No signing config needed here, it will use the default debug key
        }
        profile {
            // Profile builds should also be signed with the release key.
            // This will also inherit from the flavor's signingConfig.
        }

        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.prod
            multiDexEnabled true
            minifyEnabled true
            shrinkResources true
        }
    }

    namespace 'com.fox.flutter.tmp'
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // other dependencies
}
